name: CI-report-coverage

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'packages/**'
  workflow_dispatch:

jobs:
  check-token:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: echo "has-token=${{ secrets.COVERALLS_REPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  test-report-coverage:
    needs: check-token
    if: github.event.pull_request.draft != true && needs.check-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install packages
        run: npm i

      - name: Test
        run: npm run test

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
