name: CI

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint-build-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check publish
        run: npm run check:publish

      - name: Check versions
        run: npm run check:versions
        env:
          BASE_REF: origin/${{ github.base_ref }}

  lockfile:
    name: Verify workflow lockfile
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install the lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the lockfile
        run: gh actions-lock --verify
